<style>
:root{--bg1:#F8DDD3;--bg2:#D6E8DB;--bg3:#FBF5EC;--ink:#3E3A36;--accent:#A94A36;--card:#FFFBF4;--line:#EADBC6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a3330;--bg2:#2a3a30;--bg3:#1f1d1b}}
:root[data-theme="dark"]{--bg1:#4a3330;--bg2:#2a3a30;--bg3:#1f1d1b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Nunito',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,var(--bg1) 0,transparent 45%),radial-gradient(circle at 90% 80%,var(--bg2) 0,transparent 50%),var(--bg3);background-color:var(--bg3);display:flex;justify-content:center;padding:20px 14px 40px}
button{font:inherit;cursor:pointer}
#cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:linear-gradient(160deg,#F8DDD3,#D6E8DB);color:#3E3A36;transition:opacity .8s,transform .8s}
#cover.gone{opacity:0;transform:scale(1.08);pointer-events:none}
#cover .small{letter-spacing:4px;text-transform:uppercase;font-weight:700;font-size:14px;color:#A94A36}
#cover .script{font-family:'Great Vibes',cursive;font-size:64px;line-height:1}
.rock{transform-origin:50% 95%;animation:rock 2.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.open{margin-top:12px;border:0;border-radius:999px;padding:14px 34px;background:#A94A36;color:#fff;font-weight:700;font-size:18px;min-height:48px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.card{width:100%;max-width:440px;background:var(--card);color:#3E3A36;border-radius:28px;border:2px solid var(--line);box-shadow:0 18px 50px rgba(120,80,60,.18);overflow:hidden;text-align:center;opacity:0;transform:translateY(24px);transition:opacity .9s .3s,transform .9s .3s}
.card.show{opacity:1;transform:none}
.sky{position:relative;height:130px;background:linear-gradient(#F8DDD3,#FFFBF4)}
.balloon{position:absolute;bottom:-10px;width:46px;height:58px;border:0;border-radius:50% 50% 48% 48%;animation:float 4s ease-in-out infinite;animation-delay:var(--d);padding:0}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:50px;background:#B9A793}
.balloon:focus-visible{outline:3px solid #A94A36;outline-offset:4px}
.balloon.popped{visibility:hidden}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
.hint{font-size:12px;color:#6B625A;margin:6px 0 0}
.body{padding:6px 26px 30px}
.eyebrow{letter-spacing:4px;text-transform:uppercase;font-weight:700;font-size:13px;color:#A94A36;margin:8px 0 0}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:78px;line-height:.95;margin:4px 0 6px}
.fam{width:100%;max-width:360px;height:auto}
.sing{font-family:'Fraunces',serif;font-size:21px;line-height:1.3;margin:6px 0 14px}
.date{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.date .big{font-family:'Fraunces',serif;font-size:64px;font-weight:700;line-height:1;color:#A94A36}
.date .side{text-align:left;font-weight:700;letter-spacing:2px;font-size:14px;text-transform:uppercase;line-height:1.6}
.time{font-weight:700;font-size:20px;margin:0}
.where{margin:10px 0 0;font-size:17px;line-height:1.4}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 6px}
.count div{background:#F6EBDD;border-radius:14px;padding:10px 0}
.count b{display:block;font-family:'Fraunces',serif;font-size:26px}
.count span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6B625A}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;border:2px solid #A94A36;background:transparent;color:#A94A36;font-weight:700;text-decoration:none;font-size:15px;margin:6px 4px}
.btn[aria-pressed="true"]{background:#A94A36;color:#fff}
.rsvp{margin-top:22px;padding-top:18px;border-top:2px dashed var(--line)}
.rsvp h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px}
#msg{min-height:24px;font-weight:600;color:#3E6B52;margin:10px 0 0}
.foot{font-size:14px;color:#6B625A;margin-top:14px}
.bit{position:fixed;z-index:99;width:9px;height:14px;border-radius:2px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var cols=['#F2A99A','#8FAE9B','#F5C26B','#A9C4E0','#D9A8C9'];
function burst(x,y){
 if(reduce)return;
 for(var i=0;i<26;i++){
  var d=document.createElement('div');d.className='bit';
  d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%cols.length];
  document.body.appendChild(d);
  var a=Math.random()*Math.PI*2,r=60+Math.random()*120;
  d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+(Math.sin(a)*r+80)+'px) rotate('+Math.random()*540+'deg)',opacity:0}],{duration:900+Math.random()*700,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(e){};
  (function(el){setTimeout(function(){el.remove()},1700)})(d);
 }
}
document.getElementById('openBtn').addEventListener('click',function(e){
 document.getElementById('cover').classList.add('gone');
 document.getElementById('card').classList.add('show');
 burst(window.innerWidth/2,window.innerHeight/2);
});
document.querySelectorAll('.balloon').forEach(function(b){
 b.addEventListener('click',function(){
  var r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
  b.classList.add('popped');setTimeout(function(){b.classList.remove('popped')},4000);
 });
});
var msgs={yes:'Wonderful! We can’t wait to celebrate with you.',maybe:'No pressure. Let us know when you can.',no:'We’ll miss you, and thank you for the love!'};
document.querySelectorAll('[data-r]').forEach(function(b){
 b.addEventListener('click',function(){
  document.querySelectorAll('[data-r]').forEach(function(o){o.setAttribute('aria-pressed','false')});
  b.setAttribute('aria-pressed','true');
  document.getElementById('msg').textContent=msgs[b.dataset.r];
  if(b.dataset.r==='yes'){var r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top);}
 });
});
var target=new Date(2026,10,28,16,0,0).getTime();
function tick(){
 var t=Math.max(0,target-Date.now());
 var s=Math.floor(t/1000);
 document.getElementById('d').textContent=Math.floor(s/86400);
 document.getElementById('h').textContent=Math.floor(s%86400/3600);
 document.getElementById('m').textContent=Math.floor(s%3600/60);
 document.getElementById('s').textContent=s%60;
}
tick();setInterval(tick,1000);
})();
</script>
